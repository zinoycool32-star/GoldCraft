<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store – Minecraft Server</title>
<meta name="description" content="Support the server and unlock ranks, coins and crate keys.">
<meta name="theme-color" content="#0a0a0c">
<link rel="icon" id="favicon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.mcstatus.io">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Manrope:wght@400;500;700&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#3b82ff; --accent2:#22d3ee; --scroll-hue:0deg;
  --bg:#020408; --text:#eef0f6; --muted:#9aa1b1;
  --glass:rgba(255,255,255,.045); --glass-2:rgba(255,255,255,.075);
  --stroke:rgba(255,255,255,.09); --stroke-2:rgba(255,255,255,.16);
  --on-accent:#0a0a0c; --radius:20px; --blur:12px;
  --head:"Russo One","Chakra Petch",system-ui,sans-serif;
  --ui:"Chakra Petch",system-ui,sans-serif;
  --body:"Manrope",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:110px}
body{background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.6;overflow-x:hidden;position:relative}
body::before,body::after{content:"";position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(90px) hue-rotate(var(--scroll-hue));opacity:.45;will-change:filter}
body::before{width:520px;height:520px;top:-180px;right:-140px;background:color-mix(in srgb,var(--accent) 40%,transparent)}
body::after{width:400px;height:400px;top:45%;left:-180px;background:color-mix(in srgb,var(--accent2) 20%,transparent);opacity:.3}
a{color:inherit}
h1,h2{font-family:var(--head);font-weight:400;line-height:1.1;letter-spacing:.005em}
h3{font-family:var(--ui);line-height:1.25}
:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 80%,#fff);outline-offset:3px}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:var(--on-accent);padding:10px 16px;z-index:50;font-weight:700;border-radius:10px}
.skip:focus{left:8px}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:20px;padding:14px clamp(16px,5vw,56px);position:sticky;top:0;z-index:10;
  background:rgba(10,11,17,.55);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border-bottom:1px solid var(--stroke)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-family:var(--head);font-size:1.1rem;min-width:0}
#brandName{overflow-wrap:anywhere;min-width:0}
.logo{width:38px;height:38px;object-fit:cover;border-radius:12px;border:1px solid var(--stroke-2);image-rendering:pixelated}
.logo-fallback{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;flex:none;
  font:700 .95rem var(--head);background:color-mix(in srgb,var(--accent) 88%,transparent);color:var(--on-accent);border:1px solid color-mix(in srgb,var(--accent) 60%,#fff 12%)}
.top nav{display:flex;gap:4px;margin-left:auto}
.top nav a{text-decoration:none;color:var(--muted);font:500 .93rem var(--ui);padding:8px 13px;border-radius:10px;transition:color .2s,background .2s,box-shadow .2s}
.top nav a:hover{color:var(--text);background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--stroke)}
.top nav a[aria-current="page"]{color:var(--text);background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--stroke-2)}
.mini-copy{display:flex;align-items:center;gap:10px;font:600 .84rem var(--ui);color:var(--text);background:var(--glass);
  border:1px solid var(--stroke);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:8px 8px 8px 14px;border-radius:12px;
  transition:border-color .2s,background .2s;cursor:pointer}
.mini-copy:hover{border-color:var(--stroke-2);background:var(--glass-2)}
.mini-copy b{background:color-mix(in srgb,var(--accent) 88%,transparent);color:var(--on-accent);padding:4px 10px;border-radius:8px;font-size:.76rem}

/* ---------- nav tools: username chip + cart ---------- */
.top-tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.user-chip{display:flex;align-items:center;gap:9px;font:600 .86rem var(--ui);color:var(--text);cursor:pointer;
  background:var(--glass);border:1px solid var(--stroke);padding:6px 13px;border-radius:12px;min-height:40px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:border-color .2s,background .2s}
.user-chip:hover{border-color:var(--stroke-2);background:var(--glass-2)}
.user-chip.is-set{padding-left:6px}
.user-head{width:28px;height:28px;border-radius:8px;image-rendering:pixelated;flex:none;background:var(--glass-2)}
.user-chip span{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cart-btn{display:flex;align-items:center;gap:8px;font:600 .86rem var(--ui);color:var(--text);cursor:pointer;
  background:var(--glass);border:1px solid var(--stroke);padding:8px 13px;border-radius:12px;min-height:40px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:border-color .2s,background .2s}
.cart-btn:hover{border-color:var(--stroke-2);background:var(--glass-2)}
.cart-count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:99px;
  background:color-mix(in srgb,var(--accent) 88%,transparent);color:var(--on-accent);font:700 .7rem var(--ui)}
@media (max-width:820px){.top{flex-wrap:wrap;gap:10px}.top-tools{flex-wrap:wrap}.user-chip span{max-width:96px}}

html.nav-floating{scroll-padding-top:120px}
body.nav-floating .top{position:fixed;top:14px;left:14px;right:14px;max-width:1200px;margin:0 auto;
  border:1px solid var(--stroke);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.6);padding:10px clamp(14px,2.4vw,26px)}
body.nav-floating main{padding-top:84px}

/* ---------- hero ---------- */
.store-hero{position:relative;z-index:1;max-width:1240px;margin:auto;
  padding:clamp(44px,7vw,96px) clamp(16px,5vw,56px) clamp(20px,4vw,36px)}
.kicker{display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;color:color-mix(in srgb,var(--accent) 78%,#fff);
  font:700 .74rem var(--ui);letter-spacing:.16em;text-transform:uppercase}
.kicker::before{content:"";width:20px;height:2px;background:var(--accent);border-radius:2px}
.store-hero h1{font-size:clamp(2.4rem,6vw,4.3rem);margin-bottom:14px;overflow-wrap:anywhere;color:var(--text)}
.lead{color:var(--muted);font-size:1.08rem;max-width:58ch;overflow-wrap:anywhere}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.hero-actions[hidden]{display:none}

/* page tabs */
.page-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:30px}
.page-tabs a{display:inline-flex;align-items:center;min-height:40px;text-decoration:none;color:var(--muted);
  font:600 .82rem var(--ui);letter-spacing:.03em;padding:9px 16px;border-radius:12px;background:var(--glass);
  border:1px solid var(--stroke);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:color .2s,border-color .2s,background .2s}
.page-tabs a:hover{color:var(--text);border-color:var(--stroke-2);background:var(--glass-2)}
.page-tabs a[aria-current="page"]{background:color-mix(in srgb,var(--accent) 84%,transparent);color:var(--on-accent);
  border-color:color-mix(in srgb,var(--accent) 60%,#fff 12%);box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}

/* ---------- buttons ---------- */
.btn{font:700 .98rem var(--ui);border:1px solid color-mix(in srgb,var(--accent) 58%,#fff 10%);text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  background:color-mix(in srgb,var(--accent) 86%,transparent);color:var(--on-accent);padding:15px 26px;min-height:48px;
  border-radius:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28);transition:filter .2s,transform .15s}
.btn:hover{filter:brightness(1.09)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--glass);color:var(--text);border:1px solid var(--stroke);box-shadow:none;padding:14px 22px;font-size:.93rem;min-height:44px}
.btn.ghost:hover{background:var(--glass-2);border-color:var(--stroke-2);filter:none}

/* ---------- store body ---------- */
#storeBody{position:relative;z-index:1;max-width:1240px;margin:auto;padding:clamp(20px,4vw,34px) clamp(16px,5vw,56px) clamp(48px,7vw,88px)}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:28px}
.section-head h2{font-size:clamp(1.8rem,3.6vw,2.5rem);margin-bottom:8px}
.section-head p{color:var(--muted);max-width:58ch}
.section-head .head-text{min-width:0}
.currency-switch{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--glass);border:1px solid var(--stroke);
  border-radius:99px;flex:0 1 auto;max-width:100%;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.currency-switch[hidden]{display:none}
.currency-switch button{border:0;background:none;color:var(--muted);font:700 .78rem var(--ui);letter-spacing:.06em;
  padding:8px 14px;border-radius:99px;cursor:pointer;transition:color .2s,background .2s}
.currency-switch button:hover{color:var(--text)}
.currency-switch button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 84%,transparent);color:var(--on-accent)}

.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;align-items:stretch;grid-auto-rows:1fr}
.card-grid>.shop-card{height:100%}

/* ---------- store cards (shared glass shell) ---------- */
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.shop-card{--card-tint:var(--c,var(--accent));position:relative;display:flex;flex-direction:column;overflow:hidden;border-radius:22px;
  background:
    radial-gradient(95% 52% at 50% -26%,rgba(255,255,255,.16),transparent 68%),
    radial-gradient(125% 85% at 8% -6%,color-mix(in srgb,var(--card-tint) 30%,transparent),transparent 62%),
    linear-gradient(158deg,color-mix(in srgb,var(--card-tint) 13%,rgba(255,255,255,.06)) 0%,
      rgba(255,255,255,.022) 42%,rgba(255,255,255,.05) 100%);
  border:1px solid color-mix(in srgb,var(--card-tint) 26%,var(--stroke));
  backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(255,255,255,.04),
    inset 0 -22px 44px color-mix(in srgb,var(--card-tint) 9%,transparent),0 18px 44px rgba(0,0,0,.42);
  transition:transform .3s var(--ease),border-color .3s,box-shadow .3s;
  animation:cardIn .55s var(--ease) both}
.shop-card:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--card-tint) 48%,var(--stroke));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 1px rgba(255,255,255,.05),
    inset 0 -26px 48px color-mix(in srgb,var(--card-tint) 13%,transparent),0 28px 58px rgba(0,0,0,.5)}
.shop-card.is-featured{border-color:color-mix(in srgb,var(--card-tint) 44%,var(--stroke));
  background:
    radial-gradient(95% 52% at 50% -26%,rgba(255,255,255,.2),transparent 68%),
    radial-gradient(125% 85% at 8% -6%,color-mix(in srgb,var(--card-tint) 38%,transparent),transparent 64%),
    linear-gradient(158deg,color-mix(in srgb,var(--card-tint) 18%,rgba(255,255,255,.07)) 0%,
      rgba(255,255,255,.03) 42%,rgba(255,255,255,.055) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.05),
    inset 0 -22px 44px color-mix(in srgb,var(--card-tint) 12%,transparent),0 22px 50px rgba(0,0,0,.46)}
.shop-card::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--c);
  opacity:0;transition:opacity .3s;z-index:2}
.shop-card:hover::before{opacity:1}

.shop-badge{display:inline-flex;align-items:center;font:700 .64rem var(--ui);letter-spacing:.1em;text-transform:uppercase;
  padding:5px 10px;border-radius:99px;background:var(--c);color:var(--c-on);white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.shop-body{display:flex;flex-direction:column;flex:1;padding:20px 22px 22px;min-width:0}
.shop-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;min-width:0}
.shop-head h3{font:400 1.2rem/1.25 var(--head);overflow-wrap:anywhere;min-width:0}
.shop-tag{color:var(--muted);font-size:.9rem;margin-bottom:14px;overflow-wrap:anywhere}
.shop-price{display:flex;align-items:baseline;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.shop-price b{font:400 clamp(1.55rem,3vw,1.95rem)/1 var(--head);color:var(--text);letter-spacing:.01em}
.shop-price span{color:var(--muted);font:600 .72rem var(--ui);letter-spacing:.08em;text-transform:uppercase}
.shop-perks{list-style:none;display:grid;gap:9px;margin:0 0 20px;font-size:.9rem}
.shop-perks li{display:flex;gap:9px;align-items:flex-start;color:color-mix(in srgb,var(--text) 86%,var(--muted));overflow-wrap:anywhere;min-width:0}
.shop-perks li::before{content:"✓";flex:none;display:grid;place-items:center;width:17px;height:17px;margin-top:.12em;border-radius:50%;
  font:700 .6rem var(--ui);background:color-mix(in srgb,var(--c) 22%,transparent);
  color:color-mix(in srgb,var(--c) 82%,#fff);border:1px solid color-mix(in srgb,var(--c) 38%,transparent)}
.shop-cta{margin-top:auto;width:100%;border-radius:13px;padding:13px 18px;min-height:46px;font-size:.92rem;
  background:color-mix(in srgb,var(--c) 84%,transparent);border:1px solid color-mix(in srgb,var(--c) 58%,#fff 12%);
  color:var(--c-on);box-shadow:inset 0 1px 0 rgba(255,255,255,.24)}
.shop-cta:hover{filter:brightness(1.08)}
.shop-cta:active{transform:translateY(1px)}
.shop-actions{display:grid;gap:8px;margin-top:auto}
.shop-actions .shop-cta{margin-top:0}
.shop-add{border-radius:12px;padding:11px 16px;min-height:44px;font:700 .82rem var(--ui);letter-spacing:.02em;cursor:pointer;
  background:var(--glass);color:var(--text);border:1px solid var(--stroke);transition:background .2s,border-color .2s}
.shop-add:hover{background:var(--glass-2);border-color:var(--stroke-2)}
.shop-add:active{transform:translateY(1px)}

/* ---------- checkout screen (coins + crate keys) ---------- */
.checkout{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:18px;
  background:rgba(4,6,12,.74);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:checkoutIn .18s var(--ease)}
.checkout[hidden]{display:none}
@keyframes checkoutIn{from{opacity:0}to{opacity:1}}
.checkout-panel{width:min(540px,100%);max-height:calc(100vh - 36px);overflow:auto;border-radius:24px;padding:22px;
  background:linear-gradient(158deg,rgba(24,26,36,.99),rgba(9,11,17,.995));border:1px solid var(--stroke-2);
  box-shadow:0 34px 80px rgba(0,0,0,.66);animation:cardIn .25s var(--ease) both}
.checkout-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.checkout-head h2{font:400 1.2rem var(--head);margin-right:auto}
.checkout-close{width:34px;height:34px;border-radius:11px;border:1px solid var(--stroke);background:var(--glass);
  color:var(--text);font:700 1rem var(--ui);line-height:1}
.checkout-close:hover{background:var(--glass-2);border-color:var(--stroke-2)}
.checkout-item{display:flex;gap:14px;align-items:center;padding:12px;margin-bottom:16px;border-radius:16px;
  background:var(--glass);border:1px solid var(--stroke)}
.checkout-thumb{width:62px;height:62px;flex:none;border-radius:13px;object-fit:cover;
  background:color-mix(in srgb,var(--c,var(--accent)) 16%,rgba(255,255,255,.05));
  border:1px solid var(--stroke);display:grid;place-items:center;font:400 .95rem var(--head);color:var(--text)}
.checkout-info{min-width:0}
.checkout-info b{display:block;font:400 1.02rem var(--head);overflow-wrap:anywhere}
.checkout-info span{display:block;color:var(--muted);font-size:.82rem;margin-top:2px;overflow-wrap:anywhere}
.checkout-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.checkout-row .label{font:600 .78rem var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:auto}
.checkout-qty{display:flex;align-items:center;gap:8px}
.checkout-qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--stroke);background:var(--glass);
  color:var(--text);font:700 1rem var(--ui);line-height:1}
.checkout-qty button:hover:not(:disabled){background:var(--glass-2);border-color:var(--stroke-2)}
.checkout-qty button:disabled{opacity:.4;cursor:not-allowed}
.checkout-qty output{min-width:28px;text-align:center;font:700 .95rem var(--ui)}
.checkout-field{display:grid;gap:6px;margin-bottom:12px}
.checkout-field label{font:600 .78rem var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.checkout-field input,.checkout-field textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.04);color:var(--text);font:500 .92rem var(--body)}
.checkout-field input:focus,.checkout-field textarea:focus{outline:none;border-color:color-mix(in srgb,var(--accent) 65%,var(--stroke))}
.checkout-field input.invalid{border-color:#ff5a5a;box-shadow:0 0 0 2px rgba(255,90,90,.18)}
.checkout-field small{color:var(--muted);font-size:.76rem}
.checkout-total{display:flex;align-items:baseline;gap:10px;padding:14px 16px;border-radius:14px;margin:4px 0 16px;
  background:color-mix(in srgb,var(--accent) 12%,rgba(255,255,255,.03));
  border:1px solid color-mix(in srgb,var(--accent) 30%,var(--stroke))}
.checkout-total .label{font:600 .78rem var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:auto}
.checkout-total b{font:400 1.4rem/1 var(--head)}
.checkout-total span{color:var(--muted);font:600 .72rem var(--ui);letter-spacing:.06em;text-transform:uppercase}
.checkout-actions{display:grid;gap:10px}
.checkout-note{color:var(--muted);font-size:.78rem;margin-top:10px;text-align:center;overflow-wrap:anywhere}

/* ---------- cart ---------- */
.cart-list{display:grid;gap:10px;margin-bottom:16px}
.cart-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--glass);border:1px solid var(--stroke)}
.cart-thumb{width:46px;height:46px;flex:none;border-radius:11px;display:grid;place-items:center;overflow:hidden;
  font:400 .82rem var(--head);color:var(--text);object-fit:contain;
  background:color-mix(in srgb,var(--c,var(--accent)) 18%,rgba(255,255,255,.05));border:1px solid var(--stroke)}
.cart-info{min-width:0;flex:1}
.cart-info b{display:block;font:400 .96rem var(--head);overflow-wrap:anywhere}
.cart-info span{display:block;color:var(--muted);font-size:.78rem;margin-top:2px;overflow-wrap:anywhere}
.cart-side{display:grid;gap:6px;justify-items:end;flex:none}
.cart-qty{display:flex;align-items:center;gap:6px}
.cart-qty button{width:28px;height:28px;border-radius:9px;border:1px solid var(--stroke);background:var(--glass);
  color:var(--text);font:700 .92rem var(--ui);line-height:1;cursor:pointer}
.cart-qty button:hover:not(:disabled){background:var(--glass-2);border-color:var(--stroke-2)}
.cart-qty button:disabled{opacity:.4;cursor:not-allowed}
.cart-qty output{min-width:22px;text-align:center;font:700 .88rem var(--ui)}
.cart-line{font:600 .78rem var(--ui);color:var(--muted)}
.cart-remove{border:0;background:none;color:var(--muted);font:600 .74rem var(--ui);cursor:pointer;padding:0;
  text-decoration:underline;text-underline-offset:3px}
.cart-remove:hover{color:#ff8a8a}
.cart-empty{color:var(--muted);border:1px dashed var(--stroke-2);border-radius:16px;padding:22px;background:var(--glass);margin-bottom:14px}
.cart-actions{display:grid;gap:10px}
@media (max-width:520px){.cart-row{flex-wrap:wrap}.cart-side{width:100%;justify-items:stretch;grid-auto-flow:column;align-items:center;justify-content:space-between}}
@media (max-width:520px){.checkout-panel{padding:18px}.checkout-thumb{width:52px;height:52px}}

/* ---------- rank detail page ---------- */
.shop-card.is-clickable{cursor:pointer}
.shop-card.is-clickable:focus-visible{outline:2px solid color-mix(in srgb,var(--c) 80%,#fff);outline-offset:3px}
.rank-detail{--card-tint:var(--c,var(--accent));display:grid;gap:18px;padding:clamp(20px,3.4vw,32px);border-radius:24px;
  border:1px solid color-mix(in srgb,var(--card-tint) 30%,var(--stroke));
  background:
    radial-gradient(95% 52% at 50% -26%,rgba(255,255,255,.16),transparent 68%),

/* ---------- coming soon pages ---------- */
.coming-card{position:relative;overflow:hidden;border:1px solid var(--stroke);border-radius:var(--radius);

.store-note{margin-top:22px;color:var(--muted);font-size:.88rem}

/* ---------- browse all (popular picks + every rank, coin pack and key bundle) ---------- */
.browse-all{max-width:1240px;margin:auto;padding:0 clamp(16px,5vw,56px) clamp(44px,6vw,80px)}

.browse-tile{display:grid;gap:6px;padding:16px 18px;border-radius:16px;text-align:left;cursor:pointer;color:var(--text);

.browse-kind{font:700 .66rem var(--ui);letter-spacing:.14em;text-transform:uppercase;
  color:color-mix(in srgb,var(--c,var(--accent)) 72%,#fff)}
.browse-name{font:400 1.05rem/1.3 var(--head)}
.browse-foot{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-top:4px}
.browse-price{font:600 .88rem var(--ui);color:var(--muted)}

@media (max-width:520px){.browse-tile{padding:13px 14px}}

.empty{color:var(--muted);border:1px dashed var(--stroke-2);border-radius:16px;padding:26px;background:var(--glass)}

/* ---------- footer ---------- */
footer.site-footer{position:relative;z-index:1;margin-top:clamp(16px,3vw,40px);border-top:1px solid var(--stroke);

.footer-inner{max-width:1240px;margin:auto;padding:clamp(34px,5vw,60px) clamp(16px,5vw,56px) clamp(24px,3vw,34px);

/* ---------- ascendant light background ---------- */
.light-layer{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden;contain:paint;
  background:
    radial-gradient(ellipse 72% 58% at 50% -12%,color-mix(in srgb,var(--accent) 6%,transparent),transparent 68%),
    radial-gradient(ellipse 60% 48% at 88% 108%,color-mix(in srgb,var(--accent2) 4%,transparent),transparent 72%)}
.light-layer::before,.light-layer::after{content:"";position:absolute;border-radius:50%;pointer-events:none;
  filter:blur(56px);will-change:transform}
.light-layer::before{width:72vmax;height:72vmax;left:-20vmax;top:-26vmax;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 16%,transparent),transparent 68%);
  animation:auroraA 52s infinite ease-in-out alternate}
.light-layer::after{width:64vmax;height:64vmax;right:-22vmax;bottom:-28vmax;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent2) 12%,transparent),transparent 68%);
  animation:auroraB 68s infinite ease-in-out alternate}
@keyframes auroraA{
  0%{transform:translate3d(0,0,0) scale(1)}
  100%{transform:translate3d(13vw,9vh,0) scale(1.18)}}
@keyframes auroraB{
  0%{transform:translate3d(0,0,0) scale(1.14)}
  100%{transform:translate3d(-11vw,-7vh,0) scale(1)}}
.light-scale{position:absolute;inset:-12%;animation:lightBreathe 24s infinite ease-in-out;will-change:transform}
@keyframes lightBreathe{
  0%,100%{transform:scale(1) translate3d(0,0,0)}
  50%{transform:scale(1.09) translate3d(0,-1.5%,0)}}
.light-ray{position:absolute;top:-20%;left:50%;width:330%;height:165%;transform:translateX(-50%);
  background:linear-gradient(45deg,transparent 40%,color-mix(in srgb,var(--accent) 11%,transparent) 48%,color-mix(in srgb,var(--accent) 11%,transparent) 52%,transparent 60%);
  -webkit-mask-image:radial-gradient(ellipse at 50% -20%,black 20%,transparent 70%);
  mask-image:radial-gradient(ellipse at 50% -20%,black 20%,transparent 70%);
  animation:panLight 18s infinite ease-in-out;will-change:transform}
.light-ray.two{animation-duration:13s;animation-direction:reverse}
@keyframes panLight{
  0%,100%{transform:translateX(-50%) rotate(-42deg)}
  50%{transform:translateX(-50%) rotate(42deg)}}
.mote-container{position:absolute;inset:0;pointer-events:none}
.mote{position:absolute;width:4px;height:4px;border-radius:50%;opacity:.5;
  background:color-mix(in srgb,var(--accent) 45%,#fff);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 70%,#fff);
  animation:floatMote 10s infinite linear}
@keyframes floatMote{
  0%{transform:translate3d(0,110vh,0) rotate(0deg);opacity:0}
  10%{opacity:.7}
  90%{opacity:.7}
  100%{transform:translate3d(100px,-10vh,0) rotate(360deg);opacity:0}}

.reveal{opacity:0;transform:translateY(20px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}}

/* ---------- liquid glass buttons ---------- */

  transition:transform .3s var(--ease),box-shadow .3s var(--ease),filter .25s var(--ease),background .2s,border-color .2s}
.btn::before,.store-btn::before,.shop-cta::before,.mini-copy::before{content:"";position:absolute;inset:0;border-radius:inherit;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.14);pointer-events:none;z-index:3}
.btn::after,.store-btn::after,.shop-cta::after,.mini-copy::after,.page-tabs a::after{content:"";position:absolute;

.btn:hover,.store-btn:hover,.shop-cta:hover,.mini-copy:hover,.page-tabs a:hover{--gs:1}
.btn:active,.store-btn:active,.shop-cta:active,.mini-copy:active,.page-tabs a:active{transform:translateY(1px) scale(.975)}

function readJSON(path){
  return fetch(path,{cache:"no-store"}).then(r=>{
    if(!r.ok) throw new Error(path+": "+r.status);
    return r.json();
  });
}

function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast.id); toast.id=setTimeout(()=>t.classList.remove("show"),2200);
}

/* light accent -> dark text, dark accent -> white text (same rule as index.html) */
function onColour(hex){
  let h=String(hex||"").replace("#","");
  if(h.length===3) h=h.replace(/./g,"$&$&");
  const n=parseInt(h,16);
  if(!Number.isFinite(n)) return "#0a0a0c";
  const lum=0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255);
  return lum>150?"#0a0a0c":"#ffffff";
}

/* a card colour can be a hex value or a palette name such as "gold" */
function cardColour(value,fallback){
  const v=String(value||"").trim();
  if(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v)) return {accent:v,accent2:v};
  const key=v.toLowerCase();
  if(PALETTE[key]) return {accent:PALETTE[key].accent,accent2:PALETTE[key].accent2};
  return fallback||{accent:PALETTE.blue.accent,accent2:PALETTE.blue.accent2};
}

function applyPageTheme(cfg){
  const o=PALETTE[String(cfg.defaultColour||"").toLowerCase()]||PALETTE.blue;
  const root=document.documentElement.style;
  root.setProperty("--accent",o.accent);
  root.setProperty("--accent2",o.accent2||o.accent);
  root.setProperty("--on-accent",onColour(o.accent));
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content",o.accent);
  return o;
}

/* a store page can carry its own colour (store.json -> pages.coins.colour / pages.keys.colour) */
function applyAccent(colour,cfg){
  const base=PALETTE[String((cfg&&cfg.defaultColour)||"").toLowerCase()]||PALETTE.blue;
  const o=colour
    ? cardColour(colour,{accent:base.accent,accent2:base.accent2})
    : {accent:base.accent,accent2:base.accent2};
  const root=document.documentElement.style;
  root.setProperty("--accent",o.accent);
  root.setProperty("--accent2",o.accent2||o.accent);
  root.setProperty("--on-accent",onColour(o.accent));
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content",o.accent);
}

function copyIp(cfg){
  const ip=cfg.serverIp;
  const done=()=>toast("IP copied!");
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(ip).then(done).catch(()=>fallbackCopy(ip,done));
  }else fallbackCopy(ip,done);
}
function fallbackCopy(text,done){
  const t=document.createElement("textarea");
  t.value=text; document.body.appendChild(t); t.select();
  try{document.execCommand("copy");done()}catch(e){}
  t.remove();
}

/* ---------- prices ---------- */
function formatAmount(value,opt){
  const raw=typeof value==="number"?value:Number(String(value==null?"":value).replace(/[^0-9.\-]/g,""));
  if(!Number.isFinite(raw)) return String(value==null?"":value);
  const decimals=Number.isInteger(opt&&opt.decimals)?opt.decimals:2;
  const text=raw.toLocaleString("en-US",{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
  return (opt&&opt.symbol?opt.symbol:"")+text;
}
function numericPrice(value){
  if(typeof value==="number") return Number.isFinite(value)?value:null;
  if(value==null||typeof value==="object") return null;
  const text=String(value).trim();
  if(text===""||/[^0-9.\s]/.test(text)) return null;
  const n=Number(text);
  return Number.isFinite(n)?n:null;
}
function convertAmount(amount,cur,fromCode,toCode){
  const from=cur.options[fromCode], to=cur.options[toCode];
  if(!from||!to) return null;
  const fr=Number(from.rate), tr=Number(to.rate);
  if(!Number.isFinite(fr)||!Number.isFinite(tr)||fr===0||tr===0) return null;
  return (amount/fr)*tr;
}
/* price can be {INR:449, USD:4.99}, a plain number in the base currency, or a ready-made text like "$4.99" */
function priceFor(item,code,cur){
  const opt=cur.options[code];
  if(!opt) return "";
  const p=item?item.price:undefined;
  if(p&&typeof p==="object"&&!Array.isArray(p)){
    const key=Object.keys(p).find(k=>String(k).toLowerCase()===String(code).toLowerCase());
    if(key!==undefined) return formatAmount(p[key],opt);
    const baseCode=(cur.base&&p[cur.base]!==undefined)?cur.base:Object.keys(p)[0];
    if(baseCode===undefined) return "";
    const amount=numericPrice(p[baseCode]);
    const converted=amount===null?null:convertAmount(amount,cur,baseCode,code);
    return converted===null?String(p[baseCode]):formatAmount(converted,opt);
  }
  const amount=numericPrice(p);
  if(amount!==null){
    const converted=convertAmount(amount,cur,cur.base,code);
    return converted===null?"":formatAmount(converted,opt);
  }
  return String(p||"");
}

function buildCurrencySwitch(cur,state,onChange){
  const box=$("currencySwitch");
  if(!box) return;
  const codes=Object.keys(cur.options||{});
  if(codes.length<2){ box.hidden=true; box.innerHTML=""; return; }
  box.innerHTML="";
  box.hidden=false;
  codes.forEach(code=>{
    const opt=cur.options[code]||{};
    const button=document.createElement("button");
    button.type="button";
    button.textContent=(opt.symbol?opt.symbol+" ":"")+(opt.label||code);
    button.setAttribute("aria-pressed",String(String(code).toLowerCase()===String(state.currency).toLowerCase()));
    button.addEventListener("click",()=>{
      state.currency=code;
      try{localStorage.setItem("storeCurrency",code)}catch(e){}
      [...box.children].forEach(b=>b.setAttribute("aria-pressed",String(b===button)));
      onChange(code);
    });
    box.appendChild(button);
  });
}

function orderLinkFor(item,page){
  const own=String((item&&item.orderLink)||page.orderLink||"").trim();
  if(own) return own;
  /* store.json -> redirect.defaultOrderLink, then the Discord link from config.json */
  const redirect=CONTEXT&&CONTEXT.editor&&CONTEXT.editor.redirect;
  const fallback=String((redirect&&redirect.defaultOrderLink)||"").trim();
  if(fallback) return fallback;
  return String((CONTEXT&&CONTEXT.cfg&&CONTEXT.cfg.discordLink)||"").trim();
}

/* ---------- checkout screen (coins + crate keys) ---------- */
const CHECKOUT={item:null,page:null,qty:1};
function numericFor(item,code,cur){
  const opt=cur.options[code];
  if(!opt) return null;
  const p=item?item.price:undefined;
  if(p&&typeof p==="object"&&!Array.isArray(p)){
    const key=Object.keys(p).find(k=>String(k).toLowerCase()===String(code).toLowerCase());
    if(key!==undefined) return numericPrice(p[key]);
    const baseCode=(cur.base&&p[cur.base]!==undefined)?cur.base:Object.keys(p)[0];
    if(baseCode===undefined) return null;
    const amount=numericPrice(p[baseCode]);
    return amount===null?null:convertAmount(amount,cur,baseCode,code);
  }
  const amount=numericPrice(p);
  if(amount===null) return null;
  return convertAmount(amount,cur,cur.base,code);
}
function rememberedName(){
  try{ return String(localStorage.getItem("storeUsername")||"").trim(); }catch(e){ return ""; }
}
function wireCheckoutOnce(){
  if(wireCheckoutOnce.done) return;
  wireCheckoutOnce.done=true;
  $("checkoutClose").addEventListener("click",closeCheckout);
  $("checkout").addEventListener("click",event=>{ if(event.target===$("checkout")) closeCheckout(); });
  document.addEventListener("keydown",event=>{ if(event.key==="Escape" && !$("checkout").hidden) closeCheckout(); });
}
function openCheckout(item,page){
  wireCheckoutOnce();
  CHECKOUT.item=item||{};
  CHECKOUT.page=page||{};
  CHECKOUT.qty=1;
  drawCheckout();
  $("checkout").hidden=false;
  document.body.style.overflow="hidden";
  const name=$("checkoutName");
  if(name) setTimeout(()=>name.focus(),60);
}
function closeCheckout(){
  $("checkout").hidden=true;
  document.body.style.overflow="";
}
function drawCheckout(){
  const body=$("checkoutBody");
  const item=CHECKOUT.item, page=CHECKOUT.page;
  const cur=CONTEXT.currencyCfg, code=CONTEXT.state.currency;
  const opt=cur.options[code]||{};
  const colour=cardColour(item.colour,{accent:PALETTE.blue.accent});
  body.innerHTML="";

  /* what is being bought */
  const head=el("div","checkout-item");
  head.style.setProperty("--c",colour.accent);
  if(item.image){
    const img=el("img","checkout-thumb");
    img.src=assetUrl(item.image);
    img.alt="";
    img.onerror=()=>{ img.replaceWith(el("div","checkout-thumb",String(item.amount||"").slice(0,4))); };
    head.appendChild(img);
  }else{
    head.appendChild(el("div","checkout-thumb",String(item.amount||item.name||"?").slice(0,4)));
  }
  const info=el("div","checkout-info");
  info.appendChild(el("b",null,item.name||"Item"));
  info.appendChild(el("span",null,item.tagline||"Delivered to your account"));
  head.appendChild(info);
  body.appendChild(head);

  /* quantity */
  const qtyRow=el("div","checkout-row");
  qtyRow.appendChild(el("span","label","Quantity"));
  const qty=el("div","checkout-qty");
  const minus=el("button",null,"−");
  minus.type="button";
  minus.disabled=CHECKOUT.qty<=1;
  minus.addEventListener("click",()=>{ if(CHECKOUT.qty>1){ CHECKOUT.qty--; drawCheckout(); } });
  const plus=el("button",null,"+");
  plus.type="button";
  plus.disabled=CHECKOUT.qty>=10;
  plus.addEventListener("click",()=>{ if(CHECKOUT.qty<10){ CHECKOUT.qty++; drawCheckout(); } });
  qty.append(minus,el("output",null,String(CHECKOUT.qty)),plus);
  qtyRow.appendChild(qty);
  body.appendChild(qtyRow);

  /* total */
  const unit=numericFor(item,code,cur);
  const total=unit===null?null:unit*CHECKOUT.qty;
  const totalBox=el("div","checkout-total");
  totalBox.appendChild(el("span","label","Total"));
  totalBox.appendChild(el("b",null,total===null?priceFor(item,code,cur):formatAmount(total,opt)));
  totalBox.appendChild(el("span",null,opt.label||code));
  body.appendChild(totalBox);

  /* details */
  const nameField=el("div","checkout-field");
  const nameLabel=el("label",null,"Minecraft username");
  nameLabel.htmlFor="checkoutName";
  const nameInput=document.createElement("input");
  nameInput.id="checkoutName";
  nameInput.type="text";
  nameInput.maxLength=16;
  nameInput.autocomplete="off";
  nameInput.placeholder="Your in-game name";
  nameInput.value=rememberedName();
  nameInput.addEventListener("input",()=>nameInput.classList.remove("invalid"));
  nameField.append(nameLabel,nameInput,el("small",null,"Your order is delivered to this account - check the spelling."));
  body.appendChild(nameField);

  const mailField=el("div","checkout-field");
  const mailLabel=el("label",null,"Email (optional)");
  mailLabel.htmlFor="checkoutEmail";
  const mailInput=document.createElement("input");
  mailInput.id="checkoutEmail";
  mailInput.type="email";
  mailInput.autocomplete="email";
  mailInput.placeholder="you@example.com";
  mailField.append(mailLabel,mailInput,el("small",null,"Only used to send the receipt."));
  body.appendChild(mailField);

  /* actions */
  const actions=el("div","checkout-actions");
  const pay=el("button","btn shop-cta","Continue to payment");
  pay.type="button";
  pay.addEventListener("click",()=>{
    const name=nameInput.value.trim();
    if(name.length<3){
      nameInput.classList.add("invalid");
      nameInput.focus();
      toast("Enter your Minecraft username");
      return;
    }
    try{ localStorage.setItem("storeUsername",name); }catch(e){}
    /* no store link set -> the default Discord redirect from config.json */
    const link=orderLinkFor(item,page)||String((CONTEXT.cfg&&CONTEXT.cfg.discordLink)||"");
    if(!link){
      toast("Add a store order link in store.json first");
      return;
    }
    window.open(link,"_blank","noopener,noreferrer");
    toast("Opening payment for "+name+" in a new tab");
    closeCheckout();
  });
  const keep=el("button","btn ghost","Keep shopping");
  keep.type="button";
  keep.addEventListener("click",closeCheckout);
  actions.append(pay,keep);
  body.appendChild(actions);

  const note=item.checkoutNote||page.checkoutNote||
    (page.kind==="keys"?"Keys are added to your account automatically after payment."
      :"Coins are added to your account automatically after payment.");
  body.appendChild(el("p","checkout-note",note));
}

function el(tag,cls,text){
  const node=document.createElement(tag);
  if(cls) node.className=cls;
  if(text!==undefined) node.textContent=text;
  return node;
}

/* ---------- logo detection ---------- */
/* Tries config.json -> logoPath first, then every common logo file name, and keeps the first one that loads. */
/* auto logo: fall back to the server icon fetched from config.json -> serverIp */
function serverIconCandidates(cfg){
  const ip=String((cfg&&cfg.serverIp)||"").trim();
  if(!ip) return [];
  const host=ip.split(":")[0];
  return ["https://api.mcstatus.io/v2/icon/"+encodeURIComponent(host)];
}
function detectLogo(cfg){
  /* configured logo first, then the server icon from config.json -> serverIp, then the usual names */
  const configured=String(cfg.logoPath||"").trim();
  const icon=serverIconCandidates(cfg);
  /* with no logo file configured, try the live server icon first so no missing file is requested */
  const wanted=configured
    ? [configured].concat(icon, LOGO_CANDIDATES)
    : icon.concat(LOGO_CANDIDATES);
  const unique=[...new Set(wanted)];
  return new Promise(resolve=>{
    let index=0;
    const tryNext=()=>{
      if(index>=unique.length) return resolve("");
      const src=unique[index++];
      const img=new Image();
      img.onload=()=>{
        if(img.naturalWidth>0) resolve(src);
        else tryNext();
      };
      img.onerror=tryNext;
      img.src=src;
    };
    tryNext();
  });
}
function showLogo(src,cfg){
  const img=$("logo"), fallback=$("logoFallback");
  if(src){
    img.src=src;
    img.hidden=false;
    if(fallback) fallback.hidden=true;
    $("favicon").href=src;
  }else{
    img.hidden=true;
    if(fallback){
      fallback.hidden=false;
      fallback.textContent=String(cfg.serverName||"?").trim().charAt(0).toUpperCase()||"?";
    }
  }
}

/* ---------- routing: /store/<page>, ?page=<page>, or store.html ---------- */
function pageFromLocation(){
  const params=new URLSearchParams(location.search);
  const queryPage=String(params.get("page")||params.get("p")||"").trim().toLowerCase();
  const segments=location.pathname.split("/").filter(Boolean).map(s=>s.toLowerCase());
  /* /store/coins/5000-coins: the page is the segment after /store, the last part is the item */
  const fromPath=segments.find(segment=>PAGE_IDS.includes(segment))||"";
  if(PAGE_IDS.includes(queryPage)) return queryPage;
  if(fromPath) return fromPath;
  /* a bare /store is the browse-all page */
  return segments.includes("store")?"all":"ranks";
}
function basePath(){
  if(location.protocol==="file:") return "";
  const path=location.pathname;
  const idx=path.toLowerCase().indexOf("/store/");
  const base=idx>=0?path.slice(0,idx):path.slice(0,path.lastIndexOf("/")+1);
  return base||"/";
}
/* relative asset paths must work on /store/<page> too */
function assetUrl(src){
  const value=String(src||"").trim();
  if(!value) return "";
  if(/^(https?:|data:|blob:|\/)/i.test(value)) return value;
  return basePath()+value.replace(/^\.?\//,"");
}
function pageHref(id){
  /* the browse-all page lives at /store itself */
  if(id==="all") return location.protocol==="file:"?"store.html?page=all":basePath()+"store";
  if(location.protocol==="file:") return "store.html?page="+id;
  return basePath()+"store/"+id;
}
function homeHref(){
  return location.protocol==="file:"?"index.html":basePath()+"index.html";
}

/* ---------- item detail pages: /store/<page>/<item-slug> (ranks, coins and keys) ---------- */
function slugify(value){
  return String(value||"").toLowerCase().trim().replace(/\+/g,"-plus").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}
function itemSlugAt(items,index){
  const item=items[index]||{};
  const base=slugify(item.name)||("item-"+(index+1));
  const clash=items.findIndex((other,i)=>i<index&&(slugify(other&&other.name)||("item-"+(i+1)))===base);
  return clash>=0?base+"-"+(index+1):base;
}
function itemHref(pageId,items,index){
  const slug=itemSlugAt(items,index);
  if(location.protocol==="file:") return "store.html?page="+pageId+"&item="+encodeURIComponent(slug);
  return pageHref(pageId)+"/"+slug;
}
function itemLinkAbsolute(pageId,items,index){
  const href=itemHref(pageId,items,index);
  if(location.protocol==="file:") return href;
  try{ return location.origin+href; }catch(e){ return href; }
}
function itemFromLocation(pageId,items){
  const segments=location.pathname.split("/").filter(Boolean).map(s=>s.toLowerCase());
  const at=segments.indexOf(pageId);
  const params=new URLSearchParams(location.search);
  const query=String(params.get("item")||params.get("rank")||"").trim().toLowerCase();
  const slug=(at>=0&&segments[at+1])?segments[at+1]:query;
  if(!slug) return null;
  const index=items.findIndex((item,i)=>itemSlugAt(items,i)===slug);
  return index>=0?{item:items[index],index}:null;
}
/* opens one item's detail page without a full reload */
function openItemPage(pageId,items,index){
  const href=itemHref(pageId,items,index);
  if(location.protocol==="file:"){ location.href=href; return; }
  try{ history.pushState({page:pageId,item:itemSlugAt(items,index)},"",href); }catch(e){}
  renderPage(pageId);
  window.scrollTo({top:0,behavior:"smooth"});
}
function pageKindLabel(kind){
  return kind==="ranks"?"Rank":kind==="coins"?"Coins":kind==="keys"?"Crate keys":"Item";
}

let CONTEXT=null;   /* {cfg, editor, currency, currencyCfg, state} */

/* ---------- username + cart (kept in localStorage so a refresh keeps them) ---------- */
const CART_KEY="storeCart";
function cartRead(){
  try{
    const raw=JSON.parse(localStorage.getItem(CART_KEY)||"[]");
    return Array.isArray(raw)?raw.filter(entry=>entry&&typeof entry.page==="string"&&typeof entry.slug==="string"):[];
  }catch(e){ return []; }
}
let CART=cartRead();
function cartWrite(){
  try{ localStorage.setItem(CART_KEY,JSON.stringify(CART)); }catch(e){}
  paintCartCount();
}
function pageItems(editor,pageId){
  if(pageId==="ranks") return Array.isArray(editor.ranks)?editor.ranks:[];
  const page=pageConfig(editor,pageId);
  return Array.isArray(page.cards)?page.cards:[];
}
function cartAdd(pageId,items,index){
  if(!Array.isArray(items)||index<0) return;
  const item=items[index]||{};
  const slug=itemSlugAt(items,index);
  const found=CART.find(entry=>entry.page===pageId&&entry.slug===slug);
  if(found) found.qty=Math.min(10,(Number(found.qty)||1)+1);
  else CART.push({page:pageId,slug,name:item.name||"Item",qty:1});
  cartWrite();
  toast((item.name||"Item")+" added to your cart");
  if(!$("cart").hidden) drawCart();
}
function cartRemove(index){ CART.splice(index,1); cartWrite(); drawCart(); }
function cartSetQty(index,qty){
  const entry=CART[index];
  if(!entry) return;
  entry.qty=Math.max(1,Math.min(10,Math.round(qty)||1));
  cartWrite(); drawCart();
}
function cartCount(){ return CART.reduce((total,entry)=>total+(Number(entry.qty)||1),0); }
function cartResolve(){
  const editor=CONTEXT&&CONTEXT.editor;
  if(!editor) return [];
  return CART.map((entry,index)=>{
    const items=pageItems(editor,entry.page);
    const at=items.findIndex((item,i)=>itemSlugAt(items,i)===entry.slug);
    return {
      entry,index,items,at,
      item:at>=0?items[at]:{name:entry.name},
      page:pageConfig(editor,entry.page)
    };
  });
}
function cartTotal(){
  const cur=CONTEXT.currencyCfg, code=CONTEXT.state.currency;
  let total=0, complete=true;
  cartResolve().forEach(row=>{
    const unit=numericFor(row.item,code,cur);
    if(unit===null){ complete=false; return; }
    total+=unit*(Number(row.entry.qty)||1);
  });
  return complete?{amount:total}:null;
}
function paintCartCount(){
  const badge=$("cartCount"), button=$("cartBtn");
  if(!badge) return;
  const count=cartCount();
  badge.textContent=String(count);
  badge.hidden=count===0;
  if(button) button.setAttribute("aria-label","Open cart ("+count+" item"+(count===1?"":"s")+")");
}
function paintUser(){
  const chip=$("userBtn"), head=$("userHead"), label=$("userName");
  if(!chip||!head||!label) return;
  const name=rememberedName();
  if(name){
    label.textContent=name;
    chip.classList.add("is-set");
    head.hidden=false;
    head.onerror=()=>{ head.hidden=true; };
    head.src="https://mc-heads.net/avatar/"+encodeURIComponent(name)+"/64";
    chip.setAttribute("aria-label","Signed in as "+name+" - change username");
  }else{
    label.textContent="Sign in";
    chip.classList.remove("is-set");
    head.hidden=true;
    head.removeAttribute("src");
    chip.setAttribute("aria-label","Set your Minecraft username");
  }
}
function fillNameInputs(name){
  ["checkoutName","ticketName"].forEach(id=>{
    const node=$(id);
    if(node) node.value=name;
  });
}
function wireUserOnce(){
  if(wireUserOnce.done) return;
  wireUserOnce.done=true;
  $("userBtn").addEventListener("click",openUserDialog);
  $("userClose").addEventListener("click",closeUser);
  $("userDialog").addEventListener("click",event=>{ if(event.target===$("userDialog")) closeUser(); });
  document.addEventListener("keydown",event=>{
    if(event.key!=="Escape"||$("userDialog").hidden) return;
    closeUser();
  });
}
function openUserDialog(){ wireUserOnce(); drawUserDialog(); $("userDialog").hidden=false; document.body.style.overflow="hidden"; }
function closeUser(){
  $("userDialog").hidden=true;
  if($("checkout").hidden&&$("cart").hidden) document.body.style.overflow="";
}
function drawUserDialog(){
  const body=$("userBody");
  if(!body) return;
  body.innerHTML="";
  const box=el("div","checkout-field");
  const label=el("label",null,"Minecraft username");
  label.htmlFor="userNameInput";
  const input=document.createElement("input");
  input.id="userNameInput";
  input.type="text";
  input.maxLength=16;
  input.autocomplete="off";
  input.placeholder="Your in-game name";
  input.value=rememberedName();
  input.addEventListener("input",()=>input.classList.remove("invalid"));
  input.addEventListener("keydown",event=>{ if(event.key==="Enter") saveUsername(input); });
  box.append(label,input,el("small",null,"We fill this into your checkout and ticket details, and your skin head shows in the navbar."));
  body.appendChild(box);

  const actions=el("div","checkout-actions");
  const save=el("button","btn","Save my username");

function saveUsername(input){
  const name=String(input.value||"").trim();
  if(name.length<3){
    input.classList.add("invalid");
    input.focus();
    toast("Enter your Minecraft username");
    return;
  }
  try{ localStorage.setItem("storeUsername",name); }catch(e){}
  paintUser();
  fillNameInputs(name);
  toast("Welcome, "+name);
  closeUser();
}

/* ---------- cart screen ---------- */
function wireCartOnce(){
  if(wireCartOnce.done) return;
  wireCartOnce.done=true;
  $("cartClose").addEventListener("click",closeCart);
  $("cart").addEventListener("click",event=>{ if(event.target===$("cart")) closeCart(); });
  $("cartBtn").addEventListener("click",openCart);
  document.addEventListener("keydown",event=>{
    if(event.key!=="Escape"||$("cart").hidden) return;
    closeCart();
  });
}
function openCart(){ wireCartOnce(); drawCart(); $("cart").hidden=false; document.body.style.overflow="hidden"; }
function closeCart(){
  $("cart").hidden=true;
  if($("checkout").hidden&&$("userDialog").hidden) document.body.style.overflow="";
}
function drawCart(){
  const body=$("cartBody");
  if(!body) return;
  body.innerHTML="";
  const cur=CONTEXT.currencyCfg, code=CONTEXT.state.currency;
  const rows=cartResolve();

  if(!rows.length){
    body.appendChild(el("p","cart-empty","Your cart is empty. Add a rank, coin pack or key bundle and it appears here - it stays after a refresh."));
    const browse=el("button","btn ghost","Browse the store");
    browse.type="button";
    browse.addEventListener("click",closeCart);
    body.appendChild(browse);
    return;
  }

  const list=el("div","cart-list");
  rows.forEach(row=>{
    const colour=cardColour(row.item.colour,{accent:PALETTE.blue.accent,accent2:PALETTE.blue.accent2});
    const line=el("div","cart-row");
    line.style.setProperty("--c",colour.accent);
    if(row.item.image){
      const thumb=el("img","cart-thumb");
      thumb.src=assetUrl(row.item.image);
      thumb.alt="";
      thumb.onerror=()=>thumb.replaceWith(el("div","cart-thumb",String(row.item.amount||"?").slice(0,4)));
      line.appendChild(thumb);
    }else{
      line.appendChild(el("div","cart-thumb",String(row.item.amount||row.item.name||"?").slice(0,4)));
    }

    const info=el("div","cart-info");
    info.appendChild(el("b",null,row.item.name||row.entry.name||"Item"));
    info.appendChild(el("span",null,pageKindLabel(row.page.kind)+" · "+(priceFor(row.item,code,cur)||"—")));
    line.appendChild(info);

    const side=el("div","cart-side");
    const qty=el("div","cart-qty");
    const minus=el("button",null,"−");
    minus.type="button";
    minus.disabled=(Number(row.entry.qty)||1)<=1;
    minus.setAttribute("aria-label","One less "+(row.item.name||"item"));
    minus.addEventListener("click",()=>cartSetQty(row.index,(Number(row.entry.qty)||1)-1));
    const plus=el("button",null,"+");
    plus.type="button";
    plus.disabled=(Number(row.entry.qty)||1)>=10;
    plus.setAttribute("aria-label","One more "+(row.item.name||"item"));
    plus.addEventListener("click",()=>cartSetQty(row.index,(Number(row.entry.qty)||1)+1));
    qty.append(minus,el("output",null,String(Number(row.entry.qty)||1)),plus);
    side.appendChild(qty);

    const unit=numericFor(row.item,code,cur);
    if(unit!==null) side.appendChild(el("span","cart-line",formatAmount(unit*(Number(row.entry.qty)||1),cur.options[code]||{})));
    const remove=el("button","cart-remove","Remove");
    remove.type="button";
    remove.addEventListener("click",()=>cartRemove(row.index));
    side.appendChild(remove);
    line.appendChild(side);
    list.appendChild(line);
  });
  body.appendChild(list);

  const total=cartTotal();
  const totalBox=el("div","checkout-total");
  totalBox.appendChild(el("span","label","Cart total"));
  totalBox.appendChild(el("b",null,total?formatAmount(total.amount,cur.options[code]||{}):"—"));
  totalBox.appendChild(el("span",null,(cur.options[code]||{}).label||code));
  body.appendChild(totalBox);

  const actions=el("div","cart-actions");
  const copy=el("button","btn","Copy all cart details");
  copy.type="button";
  copy.addEventListener("click",copyCartDetails);
  actions.appendChild(copy);

  const pay=el("button","btn ghost","Continue to payment");
  pay.type="button";
  pay.addEventListener("click",()=>{
    const redirect=CONTEXT.editor&&CONTEXT.editor.redirect;
    const link=String((redirect&&redirect.defaultOrderLink)||"").trim()||String((CONTEXT.cfg&&CONTEXT.cfg.discordLink)||"");
    if(!link){ toast("Add a store order link in store.json first"); return; }
    window.open(link,"_blank","noopener,noreferrer");
    toast("Opening payment in a new tab - paste the copied cart details in your ticket");
  });
  actions.appendChild(pay);

  const clear=el("button","btn ghost","Clear cart");
  clear.type="button";
  clear.addEventListener("click",()=>{ CART=[]; cartWrite(); drawCart(); toast("Cart cleared"); });
  actions.appendChild(clear);
  body.appendChild(actions);
  body.appendChild(el("p","checkout-note","Your cart is saved in this browser, so it is still here after a refresh."));
}
function cartTicketText(){
  const cfg=CONTEXT.cfg, cur=CONTEXT.currencyCfg, code=CONTEXT.state.currency;
  const username=rememberedName();
  const rows=cartResolve();
  const lines=[
    "Hi, I would like to buy these items on "+(cfg.serverName||"the server")+".",
    "",
    "Minecraft username: "+(username||"-"),
    "Server: "+(cfg.serverName||"")+(cfg.serverIp?" ("+cfg.serverIp+")":""),
    ""
  ];
  rows.forEach((row,i)=>{
    const price=priceFor(row.item,code,cur)||"—";
    lines.push((i+1)+". "+(row.item.name||row.entry.name||"Item")+" x"+(Number(row.entry.qty)||1)+" - "+price+" each - "+pageKindLabel(row.page.kind));
  });
  const total=cartTotal();
  lines.push("",total?("Cart total: "+formatAmount(total.amount,cur.options[code]||{})):"Cart total: -","");
  if(location.protocol!=="file:") lines.push("Store: "+location.origin+basePath()+"store","");
  lines.push("Please tell me how to complete the payment and get these applied to my account.");
  return lines.join("\n");
}
function copyCartDetails(){
  if(!rememberedName()){
    openUserDialog();
    toast("Add your username first, then copy again");
    return;
  }
  if(!cartCount()){ toast("Your cart is empty"); return; }
  const text=cartTicketText();
  const done=()=>toast("All cart details copied - paste them in your ticket");
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  }else fallbackCopy(text,done);
}
function buildAddToCart(item,pageId,items,index,cls){
  if(!Array.isArray(items)||index<0) return null;
  const button=el("button",cls||"shop-add","Add to cart");
  button.type="button";
  button.addEventListener("click",event=>{
    event.preventDefault();
    event.stopPropagation();
    cartAdd(pageId,items,index);
  });
  return button;
}

function pageEnabled(editor,id){
  const pages=(editor&&editor.pages)||{};
  return pages[id]!==false;
}
function pageConfig(editor,id){
  const def=PAGES.find(p=>p.id===id)||PAGES[0];
  const shop=(editor&&editor.storePage)||{};
  const own=((editor&&editor.storePages)||{})[id]||{};
  const conf={...def,...own};
  /* ranks keep using storePage; other pages only inherit the shared order link / button text */
  if(id==="ranks"){
    if(shop.title) conf.title=own.title||shop.title;
    if(shop.subtitle) conf.subtitle=own.subtitle||shop.subtitle;
    if(shop.orderLink) conf.orderLink=own.orderLink||shop.orderLink;
    if(shop.orderButtonText) conf.orderButtonText=own.orderButtonText||shop.orderButtonText;
    if(shop.note) conf.note=own.note||shop.note;
  }else{
    conf.orderLink=String(own.orderLink||shop.orderLink||"");
    conf.orderButtonText=own.orderButtonText||def.orderButtonText||shop.orderButtonText;
  }
  conf.cards=Array.isArray(own.cards)&&own.cards.length?own.cards:(id==="ranks"?null:(own.cards||def.cards||[]));
  /* store.json -> pages.<id>.navLabel renames the tab in the store menu */
  if(own.navLabel) conf.tab=own.navLabel;
  return conf;
}

/* ---------- card builders ---------- */
function buildBadge(text){
  if(!text) return null;
  return el("span","shop-badge",String(text));
}
function buildPerks(items){
  const list=el("ul","shop-perks");
  const perks=Array.isArray(items)?items:String(items||"").split("\n");
  perks.filter(perk=>String(perk||"").trim()!=="").forEach(perk=>list.appendChild(el("li",null,String(perk))));
  return list;
}
function buildPrice(item,label){
  const price=el("div","shop-price");
  const text=priceFor(item,CONTEXT.state.currency,CONTEXT.currencyCfg);
  if(!text){ price.hidden=true; return price; }
  price.appendChild(el("b",null,text));
  if(label) price.appendChild(el("span",null,label));
  return price;
}
/* every card gets two choices: buy now, or add to the cart */
function buildBuy(item,page,onBuy,cart){
  const label=item.buttonText||page.orderButtonText||"Order Now";
  const wrap=el("div","shop-actions");
  let buy=null;
  /* coins + crate keys go through the checkout screen first */
  if(page.kind==="coins"||page.kind==="keys"){
    buy=el("button","btn shop-cta",label);
    buy.type="button";
    buy.addEventListener("click",event=>{
      event.preventDefault();
      event.stopPropagation();
      openCheckout(item,page);
    });
  }else if(typeof onBuy==="function"){
    /* ranks: Buy now opens that rank's details section automatically */
    buy=el("button","btn shop-cta",label);
    buy.type="button";
    buy.addEventListener("click",event=>{
      event.preventDefault();
      event.stopPropagation();
      onBuy();
    });
  }else{
    buy=el("a","btn shop-cta");
    const link=orderLinkFor(item,page);
    buy.textContent=label;
    if(link){
      buy.href=link;
      buy.target="_blank";
      buy.rel="noopener noreferrer";
    }else{
      buy.href="#";
      buy.addEventListener("click",event=>{
        event.preventDefault();
        toast("Add a store order link in editor.html");
      });
    }
  }
  wrap.appendChild(buy);
  if(cart){
    const add=buildAddToCart(item,cart.pageId,cart.items,cart.index);
    if(add) wrap.appendChild(add);
  }
  return wrap;
}

    if(event.key==="Enter"||event.key===" "){ event.preventDefault(); openItemPage("keys",items,index); }
  });
  return card;
}


/* ---------- item detail view + ticket guide (ranks, coins and keys) ---------- */
function itemTicketText(item,index,page,items,cfg,username){
  const price=priceFor(item,CONTEXT.state.currency,CONTEXT.currencyCfg);
  const kind=pageKindLabel(page.kind);
  const perks=(Array.isArray(item.perks)?item.perks:[]).filter(p=>String(p||"").trim()).map(p=>"- "+p).join("\n");
  const lines=[
    "Hi, I would like to buy this "+kind.toLowerCase()+" on "+(cfg.serverName||"the server")+".",
    "",
    "Minecraft username: "+(username||"-"),
    kind+": "+(item.name||kind),
    price?("Price: "+price):"",
    "Server: "+(cfg.serverName||"")+(cfg.serverIp?" ("+cfg.serverIp+")":""),
    perks?("Includes:\n"+perks):"",
    "",
    kind+" page: "+itemLinkAbsolute(page.id,items,index),
    "",
    "This ticket is about that page. Please tell me how to complete the payment and get it applied to my account."
  ];
  return lines.filter((line,i)=>line!==""||i===0||lines[i-1]!=="").join("\n");
}

function buildItemDetail(item,index,page,items,pageId){
  const cfg=CONTEXT.cfg;
  const colour=cardColour(item&&item.colour,{accent:PALETTE.blue.accent,accent2:PALETTE.blue.accent2});
  const wrap=el("article","rank-detail");
  wrap.style.setProperty("--c",colour.accent);
  wrap.style.setProperty("--c2",colour.accent2);
  wrap.style.setProperty("--c-on",onColour(colour.accent));

  const back=el("a","rank-back","\u2190 All "+String(page.tab||page.title||"items").toLowerCase());
  back.href=pageHref(pageId);
  back.addEventListener("click",event=>{
    if(event.metaKey||event.ctrlKey||event.shiftKey||event.button!==0) return;
    event.preventDefault();
    navigate(pageId);
  });
  wrap.appendChild(back);

  const top=el("div","rank-detail-top");
  const info=el("div","rank-detail-info");
  const badge=buildBadge(item.badge||(item.featured?"Most popular":""));
  if(badge) info.appendChild(badge);
  info.appendChild(el("h2",null,item.name||"Rank"));
  if(item.tagline||item.description) info.appendChild(el("p","rank-detail-tag",item.tagline||item.description));
  info.appendChild(buildPrice(item,"one-time"));
  top.appendChild(info);
  wrap.appendChild(top);

  if(Array.isArray(item.perks)&&item.perks.length){
    wrap.appendChild(el("h3",null,"What you get"));
    wrap.appendChild(buildPerks(item.perks));
  }

  const actions=el("div","rank-detail-actions");
  if(page.kind==="ranks"){
    const link=orderLinkFor(item,page)||String(cfg.discordLink||"");
    const buy=el("a","btn",item.buttonText||("Buy "+(item.name||"this rank")));
    buy.href=link||"#";
    if(link){ buy.target="_blank"; buy.rel="noopener noreferrer"; }
    actions.appendChild(buy);
  }else{
    const buy=el("button","btn",item.buttonText||page.orderButtonText||"Buy now");
    buy.type="button";
    buy.addEventListener("click",()=>openCheckout(item,page));
    actions.appendChild(buy);
  }
  const add=buildAddToCart(item,pageId,items,index,"btn ghost");
  if(add) actions.appendChild(add);
  wrap.appendChild(actions);

  const guide=el("section","ticket-guide");
  guide.appendChild(el("h3",null,"How to make a ticket"));
  const steps=el("ol","ticket-steps");
  [
    "Join the Discord server"+(cfg.discordLink?" ("+cfg.discordLink+")":"")+".",
    "Open a ticket: in the server go to the #create-a-ticket channel and press Open a ticket, or use the Support menu.",
    "Choose the Store / Purchase ticket type so it reaches the shop staff.",
    "Type your in-game name below and press Copy details - the full ticket text is copied for you.",
    "Paste it into the ticket, send it, and wait for staff to confirm the payment and apply the rank to your account."
  ].forEach(step=>steps.appendChild(el("li",null,step)));
  guide.appendChild(steps);

  /* copy details asks for the in-game username first, then copies the whole ticket */
  const copyBox=el("div","ticket-copy");
  const nameLabel=el("label",null,"Your Minecraft username");
  nameLabel.htmlFor="ticketName";
  const nameInput=document.createElement("input");
  nameInput.id="ticketName";
  nameInput.type="text";
  nameInput.maxLength=16;
  nameInput.autocomplete="off";
  nameInput.placeholder="Your in-game name";
  nameInput.value=rememberedName();
  nameInput.addEventListener("input",()=>nameInput.classList.remove("invalid"));
  const copyBtn=el("button","btn","Copy details with my username");
  copyBtn.type="button";
  copyBtn.addEventListener("click",()=>{
    const username=nameInput.value.trim();
    if(username.length<3){
      nameInput.classList.add("invalid");
      nameInput.focus();
      toast("Enter your Minecraft username");
      return;
    }
    try{ localStorage.setItem("storeUsername",username); }catch(e){}
    const text=itemTicketText(item,index,page,items,cfg,username);
    const done=()=>toast("Full details copied - paste them in your ticket");
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
    }else fallbackCopy(text,done);
  });
  copyBox.append(nameLabel,nameInput,copyBtn);
  guide.appendChild(copyBox);

  const pageLine=el("p","ticket-page");
  pageLine.append(el("span",null,"Say which page the ticket is about: "),el("code",null,item.name+" - "+itemLinkAbsolute(pageId,items,index)));
  guide.appendChild(pageLine);
  wrap.appendChild(guide);

  return wrap;
}

/* ---------- browse all: popular picks on top, then every item on one card grid ---------- */
function browseTile(group,item,index,big){
  const colour=cardColour(item&&item.colour,{accent:PALETTE.blue.accent,accent2:PALETTE.blue.accent2});
  const tile=el("button","browse-tile"+(big?" is-popular":""));
  tile.type="button";
  tile.style.setProperty("--c",colour.accent);
  tile.setAttribute("aria-label",((item&&item.name)||group.title)+" - "+(big?group.popular:"view details"));
  tile.appendChild(el("span","browse-kind",big?group.popular:group.kind));
  tile.appendChild(el("span","browse-name",(item&&item.name)||group.title));
  const foot=el("span","browse-foot");
  foot.appendChild(el("span","browse-price",priceFor(item||{},CONTEXT.state.currency,CONTEXT.currencyCfg)||""));
  foot.appendChild(el("span","browse-go","View details"));
  tile.appendChild(foot);
  tile.addEventListener("click",()=>openItemPage(group.id,group.items,index));
  return tile;
}

function buildBrowseAll(editor,cfg){
  const section=$("browseAll"), popular=$("popularRow"), grid=$("browseGrid");
  if(!section||!popular||!grid) return;
  popular.innerHTML="";
  grid.innerHTML="";

  const groups=[
    {id:"ranks",title:"Ranks",kind:"Rank",popular:"Popular rank",items:Array.isArray(editor.ranks)?editor.ranks:[]},
    {id:"coins",title:"Coins",kind:"Coins",popular:"Popular coin pack",items:[]},
    {id:"keys",title:"Crate keys",kind:"Keys",popular:"Popular key bundle",items:[]}
  ];
  ["coins","keys"].forEach(id=>{
    const page=pageConfig(editor,id);
    groups.find(group=>group.id===id).items=Array.isArray(page.cards)?page.cards:[];
  });

  const shown=groups.filter(group=>pageEnabled(editor,group.id)&&group.items.length);
  if(!shown.length){ section.hidden=true; return; }

  /* popular row: the featured item of each section, or the first one */
  shown.forEach(group=>{
    const featured=group.items.findIndex(item=>item&&item.featured);
    const index=featured>=0?featured:0;
    popular.appendChild(browseTile(group,group.items[index],index,true));
  });

  /* every rank, coin pack and key bundle as a full store card, grouped by what it is */
  const builders={ranks:buildRankCard,coins:buildCoinCard,keys:buildKeyCard};
  const fallback=PALETTE[String((cfg&&cfg.defaultColour)||"").toLowerCase()]||PALETTE.blue;
  shown.forEach(group=>{
    const page=pageConfig(editor,group.id);
    const block=el("section","browse-group");
    const head=el("h3","browse-group-head");
    head.appendChild(el("span",null,group.title));
    head.appendChild(el("span","browse-count",group.items.length+(group.items.length===1?" item":" items")));
    block.appendChild(head);
    /* one grid per group, so every card inside a group is exactly the same size */
    const cards=el("div","card-grid browse-group-grid");
    group.items.forEach((item,index)=>{
      const colour=cardColour(item&&item.colour,{accent:fallback.accent,accent2:fallback.accent2});
      cards.appendChild(builders[group.id](item||{},index,page,colour,group.items));
    });
    block.appendChild(cards);
    grid.appendChild(block);
  });

  section.hidden=false;
}

function renderTabs(editor,current){
  const tabs=$("pageTabs");
  tabs.innerHTML="";
  PAGES.filter(page=>pageEnabled(editor,page.id)).forEach(page=>{
    /* navHidden in store.json keeps a page out of the navbar (it stays reachable by URL) */
    if((((editor&&editor.storePages)||{})[page.id]||{}).navHidden===true) return;
    const link=el("a",null,page.tab||page.title);
    link.href=pageHref(page.id);
    link.dataset.page=page.id;
    if(page.id===current) link.setAttribute("aria-current","page");
    link.addEventListener("click",event=>{
      if(event.metaKey||event.ctrlKey||event.shiftKey||event.button!==0) return;
      event.preventDefault();
      navigate(page.id);
    });
    tabs.appendChild(link);
  });
  if(!tabs.children.length) tabs.hidden=true; else tabs.hidden=false;
}

function navigate(id){
  const href=pageHref(id);
  if(location.protocol==="file:"){ location.href=href; return; }
  try{ history.pushState({page:id},"",href); }catch(e){}
  renderPage(id);
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderPage(id){
  if(!CONTEXT) return;
  const {cfg,editor,state}=CONTEXT;
  const enabled=pageEnabled(editor,id);
  const page=pageConfig(editor,id);
  const isBrowse=id==="all";
  const isCards=page.kind==="ranks"||page.kind==="coins"||page.kind==="keys";
  /* coins and crate keys pages can each carry their own colour */
  applyAccent(enabled?page.colour:"",cfg);

  renderTabs(editor,id);
  showLogo(CONTEXT.logoSrc,cfg);

  const cardTitle=enabled?page.title:"Page not available";
  document.title=cfg.serverName+" – "+(enabled?page.title:"Store");
  $("storeKicker").textContent=enabled?(page.kicker||"Server store"):"Store";
  $("storeTitle").textContent=cardTitle||"";
  $("storeSubtitle").textContent=enabled?(page.subtitle||""):"This page has been turned off in the editor.";
  $("storeSubtitle").hidden=!$("storeSubtitle").textContent;

  const actions=$("heroActions");
  const orderVisible=enabled&&isCards&&String(page.orderLink||"").trim()!=="";
  if(orderVisible){
    $("orderBtn").href=String(page.orderLink).trim();
    $("orderBtn").textContent=page.orderButtonText||"Order Now";
    $("orderBtn").target="_blank";
    $("orderBtn").rel="noopener noreferrer";
    $("orderBtn").hidden=false;
  }else{
    $("orderBtn").hidden=true;
    $("orderBtn").removeAttribute("href");
  }
  actions.hidden=!enabled;

  /* /store is the browse-all page: every item in one grid, no catalogue block */
  if(isBrowse){
    $("storeBody").hidden=true;
    buildBrowseAll(editor,cfg);
    setupReveal(CONTEXT.scroll);
    return;
  }
  $("storeBody").hidden=false;

  const grid=$("cardGrid");
  const soon=$("soonSlot");
  const head=$("bodyHead");
  grid.innerHTML="";
  soon.innerHTML="";
  soon.hidden=true;

  if(!enabled){
    head.hidden=true;
    grid.hidden=true;
    const notice=el("div","notice");
    notice.appendChild(el("h2",null,"This page is switched off"));
    notice.appendChild(el("p",null,"The site owner turned this page off in the editor. Pick another page above."));
    const back=el("a","btn ghost","Back to ranks");
    back.href=pageHref("ranks");
    back.addEventListener("click",event=>{event.preventDefault();navigate("ranks")});
    notice.appendChild(back);
    soon.appendChild(notice);
    soon.hidden=false;
    $("storeNote").textContent="";
    $("browseAll").hidden=true;
    return;
  }

  head.hidden=false;
  grid.hidden=!isCards;
  $("boardTitle").textContent=page.boardTitle||"";
  $("boardText").textContent=page.boardText||"";

  if(!isCards){
    $("currencySwitch").hidden=true;
    grid.hidden=true;
    soon.appendChild(buildComingCard(page));
    soon.hidden=false;
    $("storeNote").textContent=page.note||"";
    $("browseAll").hidden=true;
    return;
  }

  const items=id==="ranks"
    ? (Array.isArray(editor.ranks)?editor.ranks:[])
    : (Array.isArray(page.cards)?page.cards:[]);

    /* every page with cards has its own detail view: /store/ranks/vip, /store/coins/5000-coins, ... */
  const found=itemFromLocation(id,items);
  if(found){
    $("currencySwitch").hidden=true;
    grid.hidden=true;
    head.hidden=true;
    soon.innerHTML="";
    soon.appendChild(buildItemDetail(found.item,found.index,page,items,id));
    soon.hidden=false;
    document.title=cfg.serverName+" – "+(found.item.name||page.title||"Store");
    $("storeKicker").textContent=pageKindLabel(page.kind)+" details";
    $("storeTitle").textContent=found.item.name||page.title||"";
    $("storeSubtitle").textContent=found.item.tagline||found.item.description||"";
    $("storeSubtitle").hidden=!$("storeSubtitle").textContent;
    $("storeNote").textContent="";
    $("browseAll").hidden=true;
    return;
  }

  grid.dataset.page=id;
  const fallbackColour=PALETTE[String(cfg.defaultColour||"").toLowerCase()]||PALETTE.blue;

  items.forEach((item,index)=>{
    const colour=cardColour(item&&item.colour,{accent:fallbackColour.accent,accent2:fallbackColour.accent2});
    const builder=id==="ranks"?buildRankCard:id==="coins"?buildCoinCard:buildKeyCard;
    grid.appendChild(builder(item||{},index,page,colour,items));
  });

  if(!items.length){
    const empty=el("p","empty","Nothing here yet. Add "+(id==="ranks"?"ranks":"packs")+" in the editor and they appear here automatically.");
    empty.style.gridColumn="1/-1";
    grid.appendChild(empty);
  }

  buildCurrencySwitch(CONTEXT.currencyCfg,state,()=>renderPage(id));

  let note=page.note||"";
  if(note && cfg.bedrockPlayersCanJoin===true){
    note+=" Bedrock players can also join at "+cfg.serverIp+" using port "+(cfg.bedrockPort||19132)+".";
  }
  $("storeNote").textContent=note;
  $("browseAll").hidden=true;
  setupReveal(CONTEXT.scroll);
}

/* ---------- ascendant light background ---------- */
/* ---------- scroll: background colour shift + reveal ---------- */
function setupScrollColour(opts){
  const root=document.documentElement;
  /* store.json -> scroll: switch the whole-page scroll effect off and the page stays still */
  if((opts&&opts.enabled===false)||(opts&&opts.colourShift===false)||matchMedia("(prefers-reduced-motion: reduce)").matches){
    root.style.setProperty("--scroll-hue","0deg");
    return;
  }
  let queued=false,lastHue=-1;
  const paint=()=>{
    queued=false;
    const max=document.documentElement.scrollHeight-innerHeight;
    const p=max>0?Math.min(1,Math.max(0,scrollY/max)):0;
    const hue=Math.round(p*24)*2; /* 24 steps: the glow repaints far less while scrolling */
    if(hue===lastHue) return;
    lastHue=hue;
    root.style.setProperty("--scroll-hue",hue+"deg");
  };
  addEventListener("scroll",()=>{
    if(queued) return;
    queued=true;
    requestAnimationFrame(paint);
    setTimeout(()=>{ if(queued) paint(); },120);
  },{passive:true});
  paint();
}
function setupReveal(opts){
  const targets=[...document.querySelectorAll(".store-hero > *, #cardGrid > *, #soonSlot > *, .store-note, #browseAll .section-head, #browseAll .browse-label, #popularRow > *, #browseGroups > *, .browse-grid > *")];
  const still=(opts&&opts.enabled===false)||(opts&&opts.reveal===false)||matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(still){ targets.forEach(el=>el.classList.add("in")); return; }
  targets.forEach((el,index)=>{
    if(el.classList.contains("reveal")) return;
    el.classList.add("reveal");
    el.style.transitionDelay=Math.min(index,8)*60+"ms";
  });
  if(!("IntersectionObserver" in window)){ targets.forEach(el=>el.classList.add("in")); return; }
  const io=new IntersectionObserver(es=>es.forEach(en=>{
    if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); }
  }),{threshold:.1});
  targets.forEach(el=>{
    if(el.getBoundingClientRect().top<innerHeight) el.classList.add("in");
    else io.observe(el);
  });
}

function setupLightBackground(){
  const layer=document.createElement("div");
  layer.className="light-layer";
  layer.setAttribute("aria-hidden","true");
  const one=document.createElement("div");
  one.className="light-ray";
  const scale=document.createElement("div");
  scale.className="light-scale";
  scale.append(one);
  layer.appendChild(scale);

  const motes=document.createElement("div");
  motes.className="mote-container";
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const count=reduce?0:(innerWidth<760?8:14);
  for(let i=0;i<count;i++){
    const mote=document.createElement("div");
    mote.className="mote";
    const size=Math.random()*3+1;
    mote.style.width=size+"px";
    mote.style.height=size+"px";
    mote.style.left=(Math.random()*100).toFixed(2)+"vw";
    mote.style.animationDelay=(-Math.random()*10).toFixed(2)+"s";
    mote.style.animationDuration=(Math.random()*5+8).toFixed(2)+"s";
    motes.appendChild(mote);
  }
  layer.appendChild(motes);
  document.body.prepend(layer);
}

/* ---------- liquid glass buttons ---------- */
function setupGlassButtons(){
  let current=null;
  document.addEventListener("pointermove",event=>{
    const target=event.target.closest?event.target.closest(".btn,.store-btn,.shop-cta,.mini-copy,.page-tabs a"):null;
    if(current&&current!==target){ current.style.removeProperty("--gx"); current.style.removeProperty("--gy"); }
    current=target;
    if(!target) return;
    const rect=target.getBoundingClientRect();
    if(!rect.width||!rect.height) return;
    target.style.setProperty("--gx",((event.clientX-rect.left)/rect.width*100).toFixed(1)+"%");
    target.style.setProperty("--gy",((event.clientY-rect.top)/rect.height*100).toFixed(1)+"%");
  },{passive:true});
}

/* store.json -> currency, ranks, coin packs, crate keys, page words, page colours, scroll and redirect.
   site.json -> floating navbar and which pages are switched on. */
function mapStore(site,store){
  const ed={...(site||{})};
  const s=store||{};
  const pages=(s.pages&&typeof s.pages==="object")?s.pages:{};
  const ranksPage=(pages.ranks&&typeof pages.ranks==="object")?pages.ranks:{};
  /* ranks keep using storePage; every other page has its own block in store.json -> pages */
  ed.storePage={...ranksPage,currency:s.currency||{}};
  ed.storePages={ranks:{...ranksPage},coins:{...(pages.coins||{})},keys:{...(pages.keys||{})}};
  ed.ranks=Array.isArray(s.ranks)?s.ranks:[];
  ed.scroll=s.scroll;
  ed.redirect=s.redirect;
  return ed;
}

(async()=>{
  const [simple,site,storeDoc]=await Promise.all([
    readJSON(assetUrl("config.json")).catch(e=>{

      return null;
    }),

    }),
    readJSON(assetUrl("store.json")).catch(e=>{
      console.warn("Could not load store.json - no store content to show.",e);
      return null;
    })
  ]);

  /* editor.html opens this page with ?preview=1 and hands over the unsaved files */
  let liveSite=null,liveStore=null,liveConfig=null;
  try{
    if(/(?:^|[?&])preview=1(?:&|$)/.test(location.search) && window.parent!==window && window.parent.__mcStoreDoc){
      liveSite=JSON.parse(JSON.stringify(window.parent.__mcSiteDoc||{}));
      liveStore=JSON.parse(JSON.stringify(window.parent.__mcStoreDoc));
      liveConfig=window.parent.__mcConfigDoc?JSON.parse(JSON.stringify(window.parent.__mcConfigDoc)):null;
    }
  }catch(error){ liveSite=null; liveStore=null; liveConfig=null; }
  const cfg={...FALLBACK,...(liveConfig||simple||{})};
  const ed=mapStore(liveSite||site||{},liveStore||storeDoc||{});
  const scrollCfg={enabled:true,colourShift:true,reveal:true,...((ed.scroll)||{})};
  applyPageTheme(cfg);

  /* currency (store.json -> currency) */
  const storeConf=(ed.storePage||{});
  const currencyCfg={...DEFAULT_CURRENCY,...(storeConf.currency||{})};
  currencyCfg.options={...DEFAULT_CURRENCY.options,...((storeConf.currency||{}).options||{})};
  const codes=Object.keys(currencyCfg.options);
  let savedCurrency=null;
  try{savedCurrency=localStorage.getItem("storeCurrency")}catch(e){}
  const startCurrency=codes.find(c=>String(c).toLowerCase()===String(savedCurrency||"").toLowerCase())
    || (currencyCfg.options[currencyCfg.default]?currencyCfg.default:codes[0]);

  if(ed.floatingNavbar===true){
    document.body.classList.add("nav-floating");
    document.documentElement.classList.add("nav-floating");
  }

  $("brandLink").href=homeHref();
  $("navStore").href=pageHref(pageEnabled(ed,"ranks")?"ranks":"coins");
  $("browseStoreBtn").href=pageHref(pageEnabled(ed,"ranks")?"ranks":"coins");

  $("brandName").textContent=cfg.serverName;
  $("ipText").textContent=cfg.serverIp;
  $("copyIp").addEventListener("click",()=>copyIp(cfg));
  $("discordBtn").href=cfg.discordLink||FALLBACK.discordLink;

  $("footerName").textContent=cfg.serverName;
  $("footerText").textContent=cfg.footerText||FALLBACK.footerText;
  $("footerCopy").textContent="© "+new Date().getFullYear()+" "+cfg.serverName;
  const homeLink=el("a",null,"Home");
  homeLink.href=homeHref();
  $("footerLinks").appendChild(homeLink);
  const link=el("a",null,"Discord");
  link.href=cfg.discordLink||FALLBACK.discordLink;
  link.target="_blank";
  link.rel="noopener noreferrer";
  $("footerLinks").appendChild(link);

  CONTEXT={cfg,editor:ed,currencyCfg,state:{currency:startCurrency},logoSrc:"",scroll:scrollCfg};
  CONTEXT.logoSrc=await detectLogo(cfg);
  showLogo(CONTEXT.logoSrc,cfg);
  setupLightBackground();
  setupScrollColour(scrollCfg);
  setupGlassButtons();
  paintCartCount();
  paintUser();
  wireCartOnce();
  wireUserOnce();
  renderPage(pageFromLocation());
})();
